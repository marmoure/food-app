<title>Sunday Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E8E4; --ink:#13201B; --ink-2:#48584F; --ink-3:#6B7C74; --line:#D2DBD6;
  --accent:#0A6B58; --accent-2:#08574A; --on-accent:#FFFFFF; --accent-soft:#D3E9E2;
  --fridge:#0A6B58; --fridge-soft:#D3E9E2;
  --frost:#2A5C93; --frost-soft:#DCE7F5;
  --fresh:#8F5B00; --fresh-soft:#F4E5C2;
  --free:#6C3F9E; --free-soft:#E9DEF5;
  --grab:#48584F; --grab-soft:#E2E8E4;
  --warn:#A13F18; --warn-soft:#F7DDD1;
  --shadow:0 1px 2px rgba(19,32,27,.05), 0 6px 18px rgba(19,32,27,.05);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1411; --surface:#131F1B; --surface-2:#1A2924; --ink:#E2ECE7; --ink-2:#A7B8B0; --ink-3:#80928A; --line:#25352F;
    --accent:#47C2A5; --accent-2:#6DD4BB; --on-accent:#05231C; --accent-soft:#153A31;
    --fridge:#47C2A5; --fridge-soft:#153A31;
    --frost:#8FB7EA; --frost-soft:#1A2C44;
    --fresh:#E5B452; --fresh-soft:#382C12;
    --free:#C6A3EE; --free-soft:#2D2040;
    --grab:#A7B8B0; --grab-soft:#1A2924;
    --warn:#EF9B75; --warn-soft:#3D2115;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1411; --surface:#131F1B; --surface-2:#1A2924; --ink:#E2ECE7; --ink-2:#A7B8B0; --ink-3:#80928A; --line:#25352F;
  --accent:#47C2A5; --accent-2:#6DD4BB; --on-accent:#05231C; --accent-soft:#153A31;
  --fridge:#47C2A5; --fridge-soft:#153A31;
  --frost:#8FB7EA; --frost-soft:#1A2C44;
  --fresh:#E5B452; --fresh-soft:#382C12;
  --free:#C6A3EE; --free-soft:#2D2040;
  --grab:#A7B8B0; --grab-soft:#1A2924;
  --warn:#EF9B75; --warn-soft:#3D2115;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 72px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,2.9rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.top .tag{color:var(--ink-2);margin-top:6px;max-width:52ch}
.weekpill{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.weekpill b{font-family:var(--display);font-size:1.1rem}
.sync{font-size:.78rem;color:var(--ink-3);font-family:var(--mono)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-bottom:22px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:.95rem}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.panel{display:grid;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:22px;align-items:start}

/* source chips */
.src{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.src::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.src-fridge{color:var(--fridge);background:var(--fridge-soft)}
.src-freezer{color:var(--frost);background:var(--frost-soft)}
.src-fresh{color:var(--fresh);background:var(--fresh-soft)}
.src-free{color:var(--free);background:var(--free-soft)}
.src-grab{color:var(--grab);background:var(--grab-soft)}

/* today */
.hero{display:grid;gap:6px}
.hero h2{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.slots{display:grid;gap:0}
.slot{display:grid;grid-template-columns:92px 1fr;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:4px}
.slot .when{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-top:3px}
.slot .what{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.slot .dish{font-weight:700;font-size:1.05rem}
.slot .how{grid-column:2;color:var(--ink-2);font-size:.92rem}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tasks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tasks .dot{width:10px;height:10px;border-radius:3px;margin-top:7px;background:var(--accent)}
.tasks .dot.frost{background:var(--frost)}
.tasks .dot.warn{background:var(--warn)}
.tasks .dot.fresh{background:var(--fresh)}

/* week switcher */
.switch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;display:grid;line-height:1.25}
.wk b{font-family:var(--display);font-size:.98rem}
.wk span{font-size:.75rem;color:var(--ink-3);font-family:var(--mono)}
.wk[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.wk[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem;color:var(--ink-2);margin-left:auto}
.toggle input{width:18px;height:18px;accent-color:var(--frost)}

/* week grid */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-rows:auto repeat(4,minmax(86px,auto));gap:6px}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day-h b{font-family:var(--display);font-size:1rem}
.day-h span{font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.cell{border-radius:8px;padding:7px 8px;font-size:.84rem;line-height:1.3;border-left:3px solid var(--line);background:var(--bg);display:grid;gap:3px;align-content:start}
.cell i{font-style:normal;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.cell.fridge{border-left-color:var(--fridge)}
.cell.freezer{border-left-color:var(--frost)}
.cell.fresh{border-left-color:var(--fresh)}
.cell.free{border-left-color:var(--free)}
.cell.grab{border-left-color:var(--grab)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
@media (max-width:900px){
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
  .day{grid-template-rows:auto}
}
@media (max-width:520px){
  .days{grid-template-columns:1fr}
  .slot{grid-template-columns:1fr}
  .slot .how{grid-column:1}
}

/* checklists */
.checks{list-style:none;margin:0;padding:0;display:grid}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.ck{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:10px 2px;cursor:pointer}
.ck input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.ck input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.ck small{display:block;color:var(--ink-3);font-size:.84rem;text-decoration:none}
.prog{font-family:var(--mono);font-size:.8rem;color:var(--ink-3)}
.shopsec h3{font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding-bottom:4px;border-bottom:2px solid var(--ink)}

/* sunday steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:62px 22px 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .t{font-family:var(--mono);font-size:.85rem;color:var(--ink-3);padding-top:1px}
.step input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.step .body b{display:block;font-family:var(--display);font-size:1.02rem}
.step input:checked ~ .body{opacity:.55}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.where > div{border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.where .f1{background:var(--fridge-soft)}
.where .f2{background:var(--frost-soft)}
.where h4{font-size:.95rem}
.where ul{margin:0;padding-left:18px}

/* buttons */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.recipe .local{font-style:italic;color:var(--ink-2);font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--ink-2)}
.meta span b{color:var(--ink)}
.recipe details summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none}
.recipe details summary::-webkit-details-marker{display:none}
.recipe details summary::before{content:"+ ";font-family:var(--mono)}
.recipe details[open] summary::before{content:"− "}
.ing{list-style:none;margin:12px 0;padding:0;display:grid;gap:4px}
.ing li{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:.93rem}
.ing .q{font-family:var(--mono);font-size:.84rem;color:var(--ink-2);text-align:right;padding-top:1px}
.rsteps{margin:0;padding-left:22px;display:grid;gap:8px;font-size:.95rem}
.note{border-radius:10px;padding:10px 12px;font-size:.9rem;background:var(--surface-2)}
.note.frost{background:var(--frost-soft)}
.kind{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* freezer */
.meter{display:grid;gap:8px}
.meter-bar{position:relative;height:14px;border-radius:999px;display:grid;grid-template-columns:6fr 8fr 6fr;overflow:hidden}
.meter-bar .z1{background:var(--warn-soft)}
.meter-bar .z2{background:var(--fridge-soft)}
.meter-bar .z3{background:var(--frost-soft)}
.meter-mark{position:absolute;top:-4px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.meter-scale{display:grid;grid-template-columns:6fr 8fr 6fr;font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.03em}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
.status.low{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--fridge-soft);color:var(--fridge)}
.status.full{background:var(--frost-soft);color:var(--frost)}
.fz-list{list-style:none;margin:0;padding:0;display:grid}
.fz-list li{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fz-list li:first-child{border-top:0}
.fz-name{font-weight:700}
.fz-age{font-size:.82rem;color:var(--ink-3);font-family:var(--mono)}
.fz-age.old{color:var(--warn)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:36px;height:34px;cursor:pointer;font-size:1.1rem;font-weight:700}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:38px;text-align:center;font-family:var(--mono);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:.84rem;color:var(--ink-2)}
.form input,.form select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);text-align:center}

/* start */
.rhythm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rhythm div{border-radius:10px;padding:10px 8px;display:grid;gap:2px;align-content:start;min-height:92px}
.rhythm b{font-family:var(--display)}
.rhythm span{font-size:.8rem;line-height:1.3}
.r-shop{background:var(--fresh-soft)}
.r-cook{background:var(--accent);color:var(--on-accent)}
.r-fridge{background:var(--fridge-soft)}
.r-freezer{background:var(--frost-soft)}
.r-free{background:var(--free-soft)}
@media (max-width:700px){.rhythm{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rules{margin:0;padding-left:20px;display:grid;gap:8px}
.prefs{display:flex;flex-wrap:wrap;gap:8px}
.prefs span{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.tab,.wk,.fchip,.btn{transition:background-color .15s,color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Weekly food system · Algiers kitchen, one person</div>
      <h1>Sunday Kitchen</h1>
      <p class="tag">Shop on Saturday, cook for about 2½ hours on Sunday, then only reheat Monday to Friday. Halal, mild, and no raw onion or garlic.</p>
    </div>
    <div class="weekpill"><b id="pill-main"></b><span class="muted small" id="pill-sub"></span><span class="sync" id="sync">Saved on this device</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="today" id="tab-today">Today</button>
    <button class="tab" role="tab" data-tab="week" id="tab-week">Week plan</button>
    <button class="tab" role="tab" data-tab="sunday" id="tab-sunday">Sunday cook</button>
    <button class="tab" role="tab" data-tab="shop" id="tab-shop">Shopping</button>
    <button class="tab" role="tab" data-tab="recipes" id="tab-recipes">Recipes</button>
    <button class="tab" role="tab" data-tab="freezer" id="tab-freezer">Freezer</button>
    <button class="tab" role="tab" data-tab="start" id="tab-start">Start here</button>
  </nav>

  <main>
    <section class="panel" id="p-today" role="tabpanel" hidden></section>
    <section class="panel" id="p-week" role="tabpanel" hidden></section>
    <section class="panel" id="p-sunday" role="tabpanel" hidden></section>
    <section class="panel" id="p-shop" role="tabpanel" hidden></section>
    <section class="panel" id="p-recipes" role="tabpanel" hidden></section>
    <section class="panel" id="p-freezer" role="tabpanel" hidden></section>
    <section class="panel" id="p-start" role="tabpanel" hidden></section>
  </main>
</div>

<script>
/* ------------------------------------------------------------------ */
/* Recipes                                                             */
/* ------------------------------------------------------------------ */
const R = {

    reheat:"Add a splash of water because it thickens. Microwave 3 min or small pot 5 min. Bread on the side.",
    ing:[["4","chicken legs (~900 g)"],["1","onion, grated"],["2","carrots, small dice"],["1","zucchini, small dice"],["1","tomato, grated"],["2 tbsp","tomato paste"],["1 small can","chickpeas, drained (or 100 g dried, soaked)"],["120 g","frik (crushed green wheat), rinsed"],["1 tsp","sweet paprika"],["½ tsp","cinnamon"],["½ tsp","black pepper"],["1 tsp","dried mint"],["2 tsp","salt"],["2 tbsp","olive oil"],["2.5 L","water"],["1 bunch","coriander, chopped"]],

/* ------------------------------------------------------------------ */
/* Dates                                                               */
/* ------------------------------------------------------------------ */
const START = new Date(2026, 8, 26); // Saturday 26 Sep 2026: first shopping day
const DAY = 86400000;
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fmt = (d, o) => d.toLocaleDateString("en-GB", o || {weekday:"short", day:"numeric", month:"short"});
const NOW = midnight(new Date());
const DI = Math.round((NOW - START) / DAY);
const STARTED = DI >= 0;
const CUR_PW = STARTED ? Math.floor(DI / 7) : 0;
const rotOf = pw => ((pw % 4) + 4) % 4;
const CUR_ROT = rotOf(CUR_PW);
const weekStart = pw => addDays(START, pw * 7);
const weekKey = pw => iso(weekStart(pw));
const pwForRot = r => CUR_PW + ((r - CUR_ROT + 4) % 4);
const DAYNAMES = ["Sat","Sun","Mon","Tue","Wed","Thu","Fri"];
const range = pw => fmt(weekStart(pw), {weekday:"short", day:"numeric", month:"short"}) + " – " + fmt(addDays(weekStart(pw), 6), {weekday:"short", day:"numeric", month:"short"});

/* ------------------------------------------------------------------ */
/* State + storage                                                     */
/* ------------------------------------------------------------------ */
const S = { checks:{}, freezer:[], mode:"local", db:null, readOnly:false };
let viewRot = CUR_ROT;
let recipeFilter = "week";
const LS_KEY = "sunday-kitchen-v1";

function loadLocal(){
  try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (j) { S.checks = j.checks || {}; S.freezer = j.freezer || []; } } catch(e) {}
}
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({checks:S.checks, freezer:S.freezer})); } catch(e) {}
}
function setSync(text){ document.getElementById("sync").textContent = text; }

const writing = {}, dirty = {};
async function flushCheck(key){
  saveLocal();
  if (S.mode !== "db" || S.readOnly) return;
  dirty[key] = true;
  if (writing[key]) return;
  writing[key] = true;
  try {
    while (dirty[key]) {
      dirty[key] = false;
      const body = JSON.parse(JSON.stringify(S.checks[key] || {items:{}}));
      await S.db.doc("checks/" + key).set(body);
    }
  } catch(e) { onWriteError(e); }
  finally { writing[key] = false; }
}
function onWriteError(e){
  if (e && e.code === "invalid_argument") { S.readOnly = true; setSync("View only · changes aren't saved"); }
  else if (e && e.code === "quota_exceeded") { setSync("Storage full. Remove old freezer rows"); }
  else setSync("Couldn't save. Try again in a moment");
}
function checkDoc(key){ return S.checks[key] || (S.checks[key] = {items:{}}); }
function isChecked(key, id){ return !!(S.checks[key] && S.checks[key].items && S.checks[key].items[id]); }
function setChecked(key, id, val){
  const d = checkDoc(key); d.items = Object.assign({}, d.items);
  if (val) d.items[id] = true; else delete d.items[id];
  flushCheck(key); syncChecks();
}
const isLight = pw => !!(S.checks[weekKey(pw)] && S.checks[weekKey(pw)].light);
function setLight(pw, val){
  const d = checkDoc(weekKey(pw)); d.light = !!val; flushCheck(weekKey(pw)); renderPlanViews();
}
const freezerTotal = () => S.freezer.reduce((a, f) => a + (Number(f.portions) || 0), 0);

async function freezerAdd(entry){
  if (S.mode === "db" && !S.readOnly) {
    try { await S.db.collection("freezer").add(entry); } catch(e) { onWriteError(e); }
  } else {
    S.freezer.push(Object.assign({id:"l" + Date.now() + Math.random().toString(36).slice(2,6)}, entry));
    saveLocal(); renderFreezer(); renderToday();
  }
}
const fzWriting = {}, fzDirty = {};
async function freezerSet(id, portions){
  const item = S.freezer.find(f => f.id === id); if (!item) return;
  item.portions = Math.max(0, portions);
  if (item.portions === 0) S.freezer = S.freezer.filter(f => f.id !== id);
  renderFreezer(); renderToday(); saveLocal();
  if (S.mode !== "db" || S.readOnly) return;
  fzDirty[id] = true; if (fzWriting[id]) return; fzWriting[id] = true;
  try {
    while (fzDirty[id]) {
      fzDirty[id] = false;
      const cur = S.freezer.find(f => f.id === id);
      if (!cur) { await S.db.doc("freezer/" + id).delete(); break; }
      await S.db.doc("freezer/" + id).update({portions: cur.portions});
    }
  } catch(e) { onWriteError(e); }
  finally { fzWriting[id] = false; }
}

  // breakfast
  if (pday <= 1) out.push({slot:"Breakfast", dish:"Weekend breakfast: eggs, bread, cheese, olive oil, fruit", src:"fresh", how:"You have time today, so cook it fresh."});
  else if (w.bf === "oats") out.push({slot:"Breakfast", dish:bf.name, src:"fridge", how:bf.reheat, recipe:w.bf});
  else out.push({slot:"Breakfast", dish:"2 " + bf.short.toLowerCase(), src: pday >= 5 ? "freezer" : "fridge", thaw: pday >= 5, how:bf.reheat, recipe:w.bf});

  const firstWeekend = pw === 0 && pday <= 1;
  const fz = (label, thaw) => firstWeekend
    ? {dish:"Simple plate: omelette, bread, cheese, cucumber & tomato with olive oil", src:"fresh", how:"Your freezer fills up on Sunday. Keep today simple."}
    : {dish:label, src:"freezer", thaw, how:REHEAT_ANY};
  const fridge = id => ({dish:R[id].name, src:"fridge", how:R[id].reheat, recipe:id});

  const table = {
    0: {L: fz("Any freezer meal, oldest first", true), D: firstWeekend ? {dish:"Eat out or with family", src:"free", how:"Enjoy it. Tomorrow you cook."} : {dish:"Freezer meal, family, or eat out", src:"freezer", how:REHEAT_ANY}},
    1: {L: firstWeekend ? fz("", false) : {dish:"Omelette & bread, or a freezer meal", src:"fresh", how:"Keep lunch light, you're cooking later."}, D: {dish:tr.name, src:"fresh", how:"Straight out of the oven, the first portion of this week's tray.", recipe:w.tray}},
    2: {L: fridge(w.tray), D: light ? fz("Freezer meal (moved last night)", true) : fridge(w.stew)},
    3: {L: light ? fz("Freezer meal (moved last night)", true) : fridge(w.stew), D: fridge(w.tray)},
    4: {L: fridge(w.tray), D: light ? fz("Freezer meal (moved last night)", true) : fridge(w.pot)},
    5: {L: light ? fz("Freezer meal (moved last night)", true) : {dish:po.name, src:"freezer", thaw:true, how:po.reheat, recipe:w.pot},
        D: light ? fz("Freezer meal (moved last night)", true) : {dish:st.name, src:"freezer", thaw:true, how:st.reheat, recipe:w.stew}},
    6: {L: light ? fz("Freezer meal (moved last night)", true) : {dish:po.name + " (or swap for any freezer meal)", src:"freezer", thaw:true, how:po.reheat, recipe:w.pot},
        D: {dish:"Free night", src:"free", how:"Eat out, order in, or cook something fun. It's part of the plan, not a slip."}}
  };
  out.push(Object.assign({slot:"Lunch"}, table[pday].L));
  const snackTxt = pday <= 1 ? "Fruit, yogurt, nuts, whatever's left" : SNACKS[pday - 2].replace("@snack", w.snack ? "2 energy balls" : "3 dates + a few almonds");
  out.push({slot:"Snack", dish:snackTxt, src:"grab", how: pday <= 1 ? "" : "Mid-afternoon, so you're not starving at dinner.", recipe: (pday === 4 && w.snack) ? w.snack : null});
  out.push(Object.assign({slot:"Dinner"}, table[pday].D));
  return out;
}

function tomorrowOf(pw, pday){ return pday === 6 ? {pw:pw+1, pday:0} : {pw, pday:pday+1}; }

function tasksFor(pw, pday){
  const w = WEEKS[rotOf(pw)], t = [];
  if (pday === 0) {
    const n = freezerTotal();
    t.push({c:"fresh", html:`<b>Shop for Week ${rotOf(pw)+1}.</b> <button class="linkbtn" data-go="shop">Open the list</button>`});
    t.push({c:"", html:`<b>Clear the fridge.</b> Eat or bin anything cooked more than 4 days ago.`});
    if (w.sat) t.push({c:"", html:`<b>Tonight:</b> ${w.sat}`});
    if (pw > 0 && n >= 14) t.push({c:"frost", html:`<b>Your freezer holds ${n} portions.</b> Make this a light week: only the tray bake and breakfasts tomorrow. <button class="linkbtn" data-go="sunday">Switch it on</button>`});
    if (pw > 0 && n < 6) t.push({c:"warn", html:`<b>The freezer is low (${n}).</b> Cook the full week tomorrow.`});
  }
  if (pday === 1) t.push({c:"", html:`<b>Sunday cook, about 2½ hours.</b> <button class="linkbtn" data-go="sunday">Open the step-by-step</button>`});
  if (pday === 6) t.push({c:"warn", html:`<b>Fridge check:</b> anything from last Sunday that's still there, eat it today or bin it.`});
  const tm = tomorrowOf(pw, pday);
  const move = planDay(rotOf(tm.pw), tm.pday, isLight(tm.pw), tm.pw).filter(s => s.src === "freezer" && s.thaw);
  if (move.length) t.push({c:"frost", html:`<b>Tonight, 30 seconds:</b> move ${move.length === 1 ? "1 thing" : move.length + " things"} from the freezer to the fridge for tomorrow: ${move.map(m => m.slot.toLowerCase() + " (" + esc(m.dish.replace(/ \(.*\)$/,"")) + ")").join(", ")}.`});
  return t;
}

/* Helpers                                                             */
/* ------------------------------------------------------------------ */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const SRC_LABEL = {fridge:"Fridge", freezer:"Freezer", fresh:"Cook fresh", free:"Free", grab:"Grab"};
const chip = src => `<span class="src src-${src}">${SRC_LABEL[src]}</span>`;
function recipeLink(id, text){ return id ? `<button class="linkbtn" data-recipe="${id}">${esc(text || "Recipe")}</button>` : ""; }
function ckRow(key, id, label, sub, group){
  const cid = "ck-" + key + "-" + id;
  return `<li><label class="ck" for="${cid}"><input type="checkbox" id="${cid}" data-ck="${key}|${id}" ${group ? `data-group="${group}"` : ""} ${isChecked(key, id) ? "checked" : ""}><span>${label}${sub ? `<small>${sub}</small>` : ""}</span></label></li>`;
}
function syncChecks(){
  document.querySelectorAll("input[data-ck]").forEach(el => {
    const [k, id] = el.dataset.ck.split("|"); el.checked = isChecked(k, id);
  });
  document.querySelectorAll("[data-prog]").forEach(el => {
    const boxes = document.querySelectorAll(`input[data-group="${el.dataset.prog}"]`);
    let n = 0; boxes.forEach(b => { if (b.checked) n++; });
    el.textContent = n + "/" + boxes.length;
  });
}
function switcher(){
  let h = `<div class="switch" role="group" aria-label="Rotation week">`;
  for (let r = 0; r < 4; r++) {
    const pw = pwForRot(r);
    const now = r === CUR_ROT && STARTED;
    h += `<button class="wk" data-rot="${r}" aria-pressed="${r === viewRot}"><b>Week ${r+1}${now ? " · now" : ""}</b><span>${fmt(weekStart(pw), {day:"numeric", month:"short"})} – ${fmt(addDays(weekStart(pw),6), {day:"numeric", month:"short"})}</span></button>`;
  }
  return h + `</div>`;
}
function lightToggle(pw){
  return `<label class="toggle" for="light-${pw}"><input type="checkbox" id="light-${pw}" data-light="${pw}" ${isLight(pw) ? "checked" : ""}> Light week: freezer is full, skip the stew and soup</label>`;
}

function sundaySteps(rot, light, pw){
  const w = WEEKS[rot], st = R[w.stew], po = R[w.pot], tr = R[w.tray], bf = R[w.bf];
  const potOven = po.kind === "pot" && /Oven/.test(po.where);
  const s = [];
  s.push({id:"setup", dur:10, t:"Set up", body:`Oven on to ${tr.temp}. Take out every ingredient, wash the vegetables, fill the sink with hot soapy water. Put on a podcast.`});
  if (!light) s.push({id:"stew", dur:20, t:"Multicooker: " + st.short, body:`Sauté, then pressure. After that it looks after itself.`, r:w.stew});
  if (!light) s.push({id:"pot", dur:20, t:(potOven ? "Second oven dish: " : "Big pot: ") + po.short, body: potOven ? `Get it ready while the tray roasts, then bake it on the lower rack.` : `On the stove, while the multicooker runs.`, r:w.pot});
  s.push({id:"tray", dur:15, t:"Oven: " + tr.short, body:`Into the oven. Set a timer.`, r:w.tray});
  const carbOn = w.carb && !(light && w.carbFor === "stew");
  s.push({id:"carb", dur:15, t:"Stove: " + (carbOn ? R[w.carb].short + " + eggs" : "boiled eggs"), body:(carbOn ? w.carbText + " " : "") + "Boil 6 eggs for snacks: 10 minutes, then cold water.", r: carbOn ? w.carb : "eggs"});
  s.push({id:"bf", dur:15, t:"Breakfasts: " + bf.short, body: w.bf === "oats" ? "Fill 5 jars. No cooking." : "When the oven is free: 180°C, 22 minutes.", r:w.bf});
  if (w.snack) s.push({id:"snack", dur:15, t:"Snack: " + R[w.snack].short, body:"Blend and roll. Makes about 16.", r:w.snack});
  s.push({id:"cool", dur:35, t:"Cool down", body:"Spoon everything into open containers and let the steam go (30–45 min, never more than 2 hours out). Wash up meanwhile. Never put a hot pot straight in the fridge."});
  s.push({id:"portion", dur:15, t:"Portion & label", body:"Follow the fridge and freezer plan below. Write the dish and today's date on masking tape for every freezer box."});
  if (!light) s.push({id:"log", dur:2, t:"Log the freezer", body:"One tap so the freezer tracker stays right.", log:true});
  s.push({id:"eat", dur:0, t:"Dinner", body:`Eat the first portion of ${tr.short}. You're done until Saturday.`});
  let m = 0;
  s.forEach(x => { x.at = Math.floor(m/60) + ":" + String(m%60).padStart(2,"0"); m += x.dur; });
  return {steps:s, total:m};
}

    <div class="grid2">
      <div class="card meter">
        <div class="eyebrow">Ready meals in the freezer</div>
        <div class="row" style="align-items:baseline"><span class="big mono">${n}</span><span class="muted">portions</span><span class="status ${status[0]}">${status[1]}</span></div>
        <div class="meter-bar" role="img" aria-label="${n} portions on a scale of 0 to 20"><span class="z1"></span><span class="z2"></span><span class="z3"></span><span class="meter-mark" style="left:${pos}%"></span></div>
        <div class="meter-scale"><span>0–5 low</span><span>6–13 healthy</span><span>14+ light week</span></div>
        <p class="muted small">A full week adds about 9 portions and you eat about 6, so the freezer slowly fills up. When it reaches 14, take a light week: cook only the tray bake and breakfasts, which takes about an hour.</p>
      </div>
      <div class="card">
        <div class="card-h"><h3>Add to the freezer</h3></div>
        <div class="row" style="margin-bottom:14px"><button class="btn" data-log="${rotOf(pw)}" ${logged ? "disabled" : ""}>${logged ? `Week ${rotOf(pw)+1} batch logged` : `Log Week ${rotOf(pw)+1} batch: ${R[w.stew].short} ×4, ${R[w.pot].short} ×5`}</button></div>
        <form class="form" id="fz-form">
          <label for="fz-dish">Dish<select id="fz-dish">${opts}<option value="_other">Something else…</option></select></label>
          <label for="fz-other" id="fz-other-wrap" hidden>Name<input id="fz-other" placeholder="e.g. Mum's couscous"></label>
          <label for="fz-n">Portions<input id="fz-n" type="number" min="1" max="20" value="2"></label>
          <label for="fz-date">Frozen on<input id="fz-date" type="date" value="${iso(NOW)}"></label>
          <button class="btn" type="submit">Add</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>What's in there</h3><span class="eyebrow">oldest first, eat from the top</span></div>
      ${items.length ? `<ul class="fz-list">${items.map(f => {
        const age = Math.round((NOW - midnight(new Date(String(f.frozen) + "T00:00:00"))) / DAY);
        const old = age > 75;
        return `<li><div><div class="fz-name">${esc(f.name)}</div><div class="fz-age ${old ? "old" : ""}">frozen ${esc(f.frozen)}${isFinite(age) ? ` · ${age <= 0 ? "today" : age + " day" + (age === 1 ? "" : "s") + " ago"}` : ""}${old ? " · eat this soon" : ""}</div></div>
          <div class="stepper"><button type="button" data-fz="${esc(f.id)}" data-d="-1" aria-label="Took one out of ${esc(f.name)}">−</button><output>${Number(f.portions)}</output><button type="button" data-fz="${esc(f.id)}" data-d="1" aria-label="Add one ${esc(f.name)}">+</button></div></li>`;
      }).join("")}</ul>` : `<div class="empty">Empty for now. After your first Sunday cook, tap <b>Log batch</b> and your stew and soup portions show up here.</div>`}
    </div>`;
}

const SETUP = [
  ["Buy: equipment", [
    ["eq-micro","Microwave","The biggest upgrade. Every reheat becomes 2 minutes. Without one everything still works on the stove, it just takes 5–7 minutes."],
    ["eq-cont","15 food containers, all the same size (~750 ml)","Freezer- and microwave-safe, with lids. Matching sizes stack neatly on the freezer shelves."],
    ["eq-jars","5 jars with lids (~400 ml)","For overnight oats. Clean jam jars work."],
    ["eq-label","Masking tape + permanent marker","Every freezer box gets the dish name and date."],
    ["eq-trays","2 baking trays + baking paper",""],
    ["eq-muffin","12-cup muffin tin","Silicone is easiest to get the muffins out of."],
    ["eq-pot","Big pot, about 8 L (marmite)","For the soups."],
    ["eq-blender","Hand blender with a chopper bowl (mixeur plongeant)","For lentil soup and energy balls."],
    ["eq-knife","Sharp chef's knife, large cutting board, peeler, grater",""],
    ["eq-spoons","Measuring spoons + a 1 L measuring jug","The recipes use tsp, tbsp and ml."]
  ]],
  ["Stock once: pantry", [
    ["pa-oil","Olive oil, 1 L",""],
    ["pa-spices","Spices","Salt, black pepper, cumin, sweet paprika (paprika douce, not \"fort\"), turmeric, cinnamon, ginger powder, dried thyme, dried mint, bay leaves."],
    ["pa-basics","Tomato paste, chicken stock cubes, honey, flour",""]
  ]],
  ["Get the kitchen ready", [
    ["ki-freezer","Empty and wipe the freezer, then give each shelf a job","Top: ready meals. Middle: bread & breakfasts. Bottom: raw meat & frozen vegetables."],
    ["ki-fridge","Clean the fridge and keep one eye-level shelf for this week's meals",""],
    ["ki-alarms","Set repeating phone alarms","Sat 10:00 \"Shop\" · Sun 15:00 \"Cook\" · Wed & Thu 21:00 \"Move freezer meals\"."]
  ]]
];

function renderStart(){
  const el = document.getElementById("p-start");
  const rh = [["Sat","Shop","r-shop"],["Sun","Cook ~2½ h","r-cook"],["Mon","Fridge","r-fridge"],["Tue","Fridge","r-fridge"],["Wed","Fridge · move Thu meals at night","r-fridge"],["Thu","Freezer","r-freezer"],["Fri","Freezer · free dinner","r-free"]];
  el.innerHTML = `
    <div class="card">
      <div class="card-h"><div><div class="eyebrow">How it works</div><h2>Cook once a week and reheat the rest.</h2></div></div>
      <div class="rhythm">${rh.map(r => `<div class="${r[2]}"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("")}</div>
      <p class="muted" style="margin-top:14px">Every Sunday you make three things at the same time: a stew in the multicooker, a soup or bake on the stove or in the oven, and a tray bake in the oven. You also make breakfasts and snacks. Stews and soups make 6 portions each. You eat some this week, and the rest builds up a freezer stock that gives you variety and the odd week off. The plan repeats every four weeks.</p>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-h"><h3>Setup checklist</h3><span class="prog" data-prog="setup-all"></span></div>
        ${SETUP.map(g => `<div class="eyebrow" style="margin:14px 0 2px">${esc(g[0])}</div><ul class="checks">${g[1].map(i => ckRow("setup", i[0], esc(i[1]), esc(i[2]), "setup-all")).join("")}</ul>`).join("")}
      </div>
      <div style="display:grid;gap:22px">
        <div class="card">
          <div class="card-h"><h3>Built around you</h3></div>
          <div class="prefs"><span>Halal</span><span>No raw onion or garlic</span><span>No vinegar</span><span>Mild, never spicy</span><span>Algerian markets</span><span>Works from home</span></div>
          <p class="muted small" style="margin-top:10px">Salads are cucumber, tomato and pepper with olive oil and salt, or a yogurt-mint sauce. No vinaigrette anywhere.</p>
        </div>
        <div class="card">
          <div class="card-h"><h3>Food safety, the short version</h3></div>
          <ul class="rules">
            <li>Cooked food lasts <b>4 days</b> in the fridge at most. That's why Thursday and Friday meals come from the freezer.</li>
            <li>Cool food within <b>2 hours</b> (rice within 1). Spread it out in open containers. A hot pot in the fridge warms everything around it.</li>
            <li>Thaw in the <b>fridge overnight</b>, never on the counter.</li>
            <li>Reheat until it's steaming all the way through, and only reheat once.</li>
            <li>Label every freezer box and eat it within <b>3 months</b>.</li>
          </ul>
        </div>
        <div class="card">
          <div class="card-h"><h3>Easy on heartburn</h3></div>
          <ul class="rules">
            <li>Sweet paprika only. No harissa, no chili, no spicy cachir.</li>
            <li>Tomato is kept low because it's acidic, and carrots in the stews soften it.</li>
            <li>Roasted and baked, not deep-fried.</li>
            <li>Try to finish dinner 2–3 hours before bed. With the side hustle, set a fixed dinner time and keep late snacks small (yogurt, banana).</li>
            <li>Have coffee after food, not on an empty stomach.</li>
            <li>If heartburn happens several times a week, see a doctor. It's common and treatable.</li>
          </ul>
        </div>
      </div>
    </div>`;
  syncChecks();
}

function renderPlanViews(){ renderHeader(); renderToday(); renderWeek(); renderSunday(); }
function renderAll(){ renderPlanViews(); renderShop(); renderRecipes(); renderFreezer(); renderStart(); }

/* ------------------------------------------------------------------ */
/* Tabs + events                                                       */
/* ------------------------------------------------------------------ */
const TABS = ["today","week","sunday","shop","recipes","freezer","start"];
function showTab(name){
  if (!TABS.includes(name)) name = "today";
  TABS.forEach(t => {
    document.getElementById("p-" + t).hidden = t !== name;
    const b = document.getElementById("tab-" + t);
    b.setAttribute("aria-selected", String(t === name));
  });
  try { history.replaceState(null, "", "#" + name); } catch(e) {}
  try { localStorage.setItem("sk-tab", name); } catch(e) {}
}
function openRecipe(id){
  const r = R[id]; if (!r) return;
  if (r.week) viewRot = r.week - 1;
  recipeFilter = r.week ? "week" : (r.kind === "snack" ? "breakfast" : r.kind);
  renderRecipes(); renderWeek(); renderSunday(); renderShop();
  showTab("recipes");
  const d = document.getElementById("d-" + id); if (d) d.open = true;
  const a = document.getElementById("r-" + id); if (a) a.scrollIntoView({block:"start"});
}
let clearArm = null;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-go],[data-rot],[data-recipe],[data-rf],[data-log],[data-fz],[data-clear]");
  if (!t) return;
  if (t.dataset.tab) showTab(t.dataset.tab);
  else if (t.dataset.go) { showTab(t.dataset.go); window.scrollTo(0, 0); }
  else if (t.dataset.rot) { viewRot = Number(t.dataset.rot); renderWeek(); renderSunday(); renderShop(); renderRecipes(); }
  else if (t.dataset.recipe) openRecipe(t.dataset.recipe);
  else if (t.dataset.rf) { recipeFilter = t.dataset.rf; renderRecipes(); }
  else if (t.dataset.log) {
    const rot = Number(t.dataset.log), key = weekKey(pwForRot(rot)), w = WEEKS[rot];
    if (isChecked(key, "logged")) return;
    const d = iso(NOW);
    setChecked(key, "logged", true);
    freezerAdd({name:R[w.stew].name, recipe:w.stew, portions:4, frozen:d}).then(() => freezerAdd({name:R[w.pot].name, recipe:w.pot, portions:5, frozen:d}));
    renderSunday(); renderFreezer();
  }
  else if (t.dataset.fz) {
    const f = S.freezer.find(x => x.id === t.dataset.fz);
    if (f) freezerSet(f.id, Number(f.portions) + Number(t.dataset.d));
  }
  else if (t.dataset.clear) {
    if (clearArm !== t.dataset.clear) { clearArm = t.dataset.clear; t.textContent = "Tap again to untick all"; setTimeout(() => { if (clearArm) { clearArm = null; const b = document.getElementById("clear-shop"); if (b) b.textContent = "Untick everything"; } }, 3000); return; }
    clearArm = null;
    const d = checkDoc(t.dataset.clear); const items = Object.assign({}, d.items);
    Object.keys(items).forEach(k => { if (k.startsWith("shop-")) delete items[k]; });
    d.items = items; flushCheck(t.dataset.clear); syncChecks();
    t.textContent = "Untick everything";
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.ck) { const [k, id] = el.dataset.ck.split("|"); setChecked(k, id, el.checked); }
  else if (el.dataset && el.dataset.light) setLight(Number(el.dataset.light), el.checked);
  else if (el.id === "fz-dish") document.getElementById("fz-other-wrap").hidden = el.value !== "_other";
});
document.addEventListener("submit", e => {
  if (e.target.id !== "fz-form") return;
  e.preventDefault();
  const v = document.getElementById("fz-dish").value;
  const name = v === "_other" ? document.getElementById("fz-other").value.trim() : R[v].name;
  const n = Math.max(1, Math.min(20, parseInt(document.getElementById("fz-n").value, 10) || 1));
  const date = document.getElementById("fz-date").value || iso(NOW);
  if (!name) { document.getElementById("fz-other").focus(); return; }
  freezerAdd({name, recipe: v === "_other" ? null : v, portions:n, frozen:date});
});

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
loadLocal();
renderAll();
let startTab = (location.hash || "").slice(1);
if (!TABS.includes(startTab)) { try { startTab = localStorage.getItem("sk-tab") || ""; } catch(e) {} }
showTab(TABS.includes(startTab) ? startTab : (STARTED ? "today" : "start"));

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) return;
  S.db = db; S.mode = "db"; setSync("Synced across your devices");
  let lightSig = "";
  db.collection("checks").onSnapshot(snap => {
    const c = {};
    snap.docs.forEach(d => { const b = d.data(); if (b) c[d.id] = JSON.parse(JSON.stringify(b)); });
    S.checks = c; saveLocal();
    const sig = Object.keys(c).filter(k => c[k].light).sort().join(",");
    if (sig !== lightSig) { lightSig = sig; renderPlanViews(); }
    renderHeader(); syncChecks();
    const setupOpen = !STARTED; if (setupOpen) renderToday();
    renderFreezer();
  }, () => setSync("Offline · saved on this device"));
  db.collection("freezer").onSnapshot(snap => {
    S.freezer = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    saveLocal(); renderFreezer(); renderToday();
  }, () => setSync("Offline · saved on this device"));
})();
</script>
